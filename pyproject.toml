[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waveguide-sim"
version = "0.2.0"
description = "Scalar paraxial waveguide field simulation with classical RK4"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["waveguide_sim*"]
